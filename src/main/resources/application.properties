spring.application.name=TicketDesk

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${TICKETDESK_DB_URL:jdbc:postgresql://localhost:5432/ticketdesk}
spring.datasource.username=${TICKETDESK_DB_USERNAME:ticketdesk_app}
spring.datasource.password=${TICKETDESK_DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================

server.port=8080